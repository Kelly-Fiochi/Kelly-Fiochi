<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-label="Terminal animado mostrando testes automatizados passando" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace; font-size: 15px; fill: #c9d1d9; }
    .ok { fill: #3fb950; }
    .dim { fill: #6e7681; }
    .cmd { fill: #58a6ff; }
    .title { font-size: 12px; fill: #8b949e; }

    .l1 { animation: k1 12s infinite; opacity: 0; }
    .l2 { animation: k2 12s infinite; opacity: 0; }
    .l3 { animation: k3 12s infinite; opacity: 0; }
    .l4 { animation: k4 12s infinite; opacity: 0; }
    .l5 { animation: k5 12s infinite; opacity: 0; }
    .l6 { animation: k6 12s infinite; opacity: 0; }

    @keyframes k1 { 0%,3% {opacity:0} 4%,92% {opacity:1} 100% {opacity:0} }
    @keyframes k2 { 0%,20% {opacity:0} 21%,92% {opacity:1} 100% {opacity:0} }
    @keyframes k3 { 0%,32% {opacity:0} 33%,92% {opacity:1} 100% {opacity:0} }
    @keyframes k4 { 0%,45% {opacity:0} 46%,92% {opacity:1} 100% {opacity:0} }
    @keyframes k5 { 0%,57% {opacity:0} 58%,92% {opacity:1} 100% {opacity:0} }
    @keyframes k6 { 0%,70% {opacity:0} 71%,92% {opacity:1} 100% {opacity:0} }

    .bar { transform-box: fill-box; transform-origin: left center; animation: bar 12s infinite; transform: scaleX(0); }
    @keyframes bar {
      0%,4% { transform: scaleX(0) }
      21% { transform: scaleX(0.25) }
      33% { transform: scaleX(0.5) }
      46% { transform: scaleX(0.75) }
      58%,92% { transform: scaleX(1) }
      100% { transform: scaleX(0) }
    }

    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,50% {opacity:1} 50.01%,100% {opacity:0} }
  </style>

  <!-- janela do terminal -->
  <rect x="10" y="10" width="780" height="260" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="10" y="10" width="780" height="40" rx="12" fill="#161b22"/>
  <rect x="10" y="38" width="780" height="12" fill="#161b22"/>
  <circle cx="34" cy="30" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="30" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="30" r="6" fill="#27c93f"/>
  <text class="title" x="400" y="35" text-anchor="middle">kelly@qa: ~/e2e-tests</text>

  <!-- linhas de teste -->
  <g class="l1"><text x="36" y="82"><tspan class="ok">$</tspan> <tspan class="cmd">npm run test:e2e</tspan></text></g>
  <g class="l2"><text x="36" y="110"><tspan class="ok">✔</tspan> login.cy.js <tspan class="dim">...................</tspan> <tspan class="ok">passing</tspan></text></g>
  <g class="l3"><text x="36" y="138"><tspan class="ok">✔</tspan> checkout.cy.js <tspan class="dim">...............</tspan> <tspan class="ok">passing</tspan></text></g>
  <g class="l4"><text x="36" y="166"><tspan class="ok">✔</tspan> api-contract.cy.js <tspan class="dim">...........</tspan> <tspan class="ok">passing</tspan></text></g>
  <g class="l5"><text x="36" y="194"><tspan class="ok">✔</tspan> regression.cy.js <tspan class="dim">.............</tspan> <tspan class="ok">passing</tspan></text></g>

  <!-- barra de progresso -->
  <rect x="36" y="208" width="728" height="10" rx="5" fill="#21262d"/>
  <rect class="bar" x="36" y="208" width="728" height="10" rx="5" fill="#3fb950"/>

  <!-- resultado final -->
  <g class="l6">
    <text x="36" y="248"><tspan class="ok">All specs passed</tspan> <tspan class="dim">|</tspan> Kelly Fiochi <tspan class="dim">·</tspan> QA Analyst <tspan class="dim">·</tspan> Automação de Testes</text>
    <rect class="cursor" x="640" y="236" width="9" height="16" fill="#3fb950"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
